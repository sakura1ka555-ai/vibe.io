<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBE — Совместный кинотеатр</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #0d0d0f; font-family: system-ui, -apple-system, sans-serif; }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col justify-between p-6 relative overflow-hidden select-none">

    <!-- Задний Rave-градиент -->
    <div class="absolute top-0 right-0 w-[250px] h-[250px] pointer-events-none opacity-20" style="background: radial-gradient(circle, rgba(147,51,234,0.3) 0%, rgba(0,0,0,0) 70%);"></div>

    <div class="w-full max-w-md mx-auto flex flex-col justify-between flex-1 relative z-10">
        
        <!-- Шапка -->
        <div class="text-center my-8">
            <h1 class="text-5xl font-black tracking-widest bg-clip-text text-transparent bg-gradient-to-r from-white to-neutral-400">VIBE</h1>
            <p class="text-[10px] text-white/40 tracking-wider uppercase mt-1">Совместный просмотр секунда в секунду</p>
        </div>

        <!-- Блок поиска -->
        <div class="flex flex-col gap-2 relative mb-auto">
            <label id="input-label" class="text-[10px] font-bold text-purple-400 uppercase tracking-wider ml-1">Поиск фильма или сериала</label>
            
            <!-- Поле ввода -->
            <div class="w-full bg-[#121215] border border-white/5 rounded-2xl p-4 flex items-center justify-between focus-within:border-purple-500/30 transition-all relative">
                <input id="search-input" type="text" placeholder="Введите название фильма..." class="bg-transparent border-none outline-none flex-1 text-xs text-white placeholder-white/20 pr-8">
                <button id="clear-btn" class="hidden absolute right-4 text-white/40 text-xs hover:text-white cursor-pointer">✕</button>
                <span id="search-icon" class="text-white/20 absolute right-4 text-xs">🔍</span>
            </div>

            <!-- Меню табов и выпадающего списка -->
            <div class="absolute top-[68px] left-0 right-0 bg-[#0d0d0f] border border-white/5 rounded-2xl shadow-2xl overflow-hidden z-50 flex flex-col w-full">
                <!-- Табы переключения -->
                <div class="flex items-center gap-1.5 p-2 bg-[#121215] border-b border-white/5 overflow-x-auto hide-scroll">
                    <button id="tab-catalog" class="px-2.5 py-1 rounded-lg text-[10px] font-bold bg-[#24242b] text-white border border-white/10 cursor-pointer transition-all">Каталог</button>
                    <button id="tab-vk" class="px-2.5 py-1 rounded-lg text-[10px] font-bold text-white/40 cursor-pointer transition-all">ВК Видео</button>
                    <button id="tab-rutube" class="px-2.5 py-1 rounded-lg text-[10px] font-bold text-white/40 cursor-pointer transition-all">RuTube</button>
                    <button id="tab-youtube" class="px-2.5 py-1 rounded-lg text-[10px] font-bold text-white/40 cursor-pointer transition-all">YouTube</button>
                </div>

                <!-- Список фильмов -->
                <div id="results-box" class="flex flex-col max-h-[250px] overflow-y-auto p-1.5 gap-0.5 bg-[#0d0d0f]"></div>
            </div>
            <p id="loading-txt" class="hidden text-[10px] text-purple-400 ml-2 animate-pulse mt-1">Поиск по базам TMDB...</p>
        </div>

        <!-- Кнопка запуска -->
        <button id="start-btn" disabled class="w-full py-4 bg-white/5 text-white/20 border border-transparent font-black rounded-2xl text-xs uppercase tracking-wider mb-2 transition-all cursor-not-allowed">
            Открыть кинозал 🎬
        </button>
    </div>

    <!-- Вся логика без бэкенда напрямую на клиенте -->
    <script>
        let currentTab = 'catalog';
        let selectedVideoUrl = '';
        const tmdbKey = '3eca5710d29b207567e9f3b8900010c2';

        const searchInput = document.getElementById('search-input');
        const clearBtn = document.getElementById('clear-btn');
        const searchIcon = document.getElementById('search-icon');
        const resultsBox = document.getElementById('results-box');
        const loadingTxt = document.getElementById('loading-txt');
        const inputLabel = document.getElementById('input-label');
        const startBtn = document.getElementById('start-btn');

        const tabs = {
            catalog: document.getElementById('tab-catalog'),
            vk: document.getElementById('tab-vk'),
            rutube: document.getElementById('tab-rutube'),
            youtube: document.getElementById('tab-youtube')
        };

        // Переключение вкладок дизайна
        Object.keys(tabs).forEach(tabName => {
            tabs[tabName].addEventListener('click', () => {
                currentTab = tabName;
                selectedVideoUrl = '';
                searchInput.value = '';
                searchInput.disabled = false;
                resultsBox.innerHTML = '';
                clearBtn.classList.add('hidden');
                searchIcon.classList.remove('hidden');
                updateButtonState(false);

                Object.keys(tabs).forEach(t => {
                    tabs[t].className = "px-2.5 py-1 rounded-lg text-[10px] font-bold text-white/40 cursor-pointer transition-all";
                });

                if (tabName === 'catalog') {
                    tabs.catalog.className = "px-2.5 py-1 rounded-lg text-[10px] font-bold bg-[#24242b] text-white border border-white/10 cursor-pointer transition-all";
                    searchInput.placeholder = "Введите название фильма...";
                    inputLabel.innerText = "Поиск фильма или сериала";
                } else {
                    tabs[tabName].className = `px-2.5 py-1 rounded-lg text-[10px] font-bold text-white cursor-pointer transition-all ` + 
                        (tabName === 'vk' ? 'bg-blue-600' : tabName === 'rutube' ? 'bg-red-500' : 'bg-red-600');
                    searchInput.placeholder = "Вставьте скопированную ссылку на видео...";
                    inputLabel.innerText = `Вставьте ссылку из ${tabName.toUpperCase()}`;
                    resultsBox.innerHTML = `<div class="p-4 text-center text-[10px] text-white/30 italic leading-normal">Откройте вкладку ${tabName.toUpperCase()}, скопируйте ссылку на видео и вставьте её выше.</div>`;
                }
            });
        });

        // Живой поиск фильмов напрямую через API TMDB
        let debounceTimer;
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            
            if (query.length > 0) {
                clearBtn.classList.remove('hidden');
                searchIcon.classList.add('hidden');
            } else {
                clearBtn.classList.add('hidden');
                searchIcon.classList.remove('hidden');
                resultsBox.innerHTML = '';
                updateButtonState(false);
                return;
            }

            if (currentTab !== 'catalog') {
                parseDirectLink(query);
                return;
            }

            if (query.length < 3) { resultsBox.innerHTML = ''; return; }

            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(async () => {
                loadingTxt.classList.remove('hidden');
                try {
                    const res = await fetch(`https://themoviedb.org{tmdbKey}&query=${encodeURIComponent(query)}&language=ru-RU&page=1`);
                    const data = await res.json();
                    resultsBox.innerHTML = '';
                    
                    if (data && data.results && data.results.length > 0) {
                        data.results.slice(0, 8).forEach(movie => {
                            const poster = movie.poster_path ? `https://tmdb.org{movie.poster_path}` : 'https://unsplash.com';
                            const year = movie.release_date ? movie.release_date.split('-')[0] : '----';
                            const playerUrl = `https://vseerialy.xyz{movie.id}&ads=0&autoplay=1`;

                            const btn = document.createElement('div');
                            btn.className = "w-full flex items-center gap-3 p-2 hover:bg-white/[0.04] rounded-xl text-left cursor-pointer group transition-all";
                            btn.innerHTML = `
                                <div class="w-8 h-11 bg-neutral-900 rounded-md overflow-hidden flex-shrink-0 border border-white/5 shadow-inner bg-cover bg-center" style="background-image: url('${poster}');"></div>
                                <div class="flex-1 min-w-0">
                                  <h4 class="text-xs font-bold text-white group-hover:text-purple-400 truncate transition-colors">${movie.title}</h4>
                                  <p class="text-[10px] text-white/30 font-medium mt-0.5">${year} · Онлайн Плеер HD</p>
                                </div>
                            `;
                            btn.addEventListener('click', () => {
                                selectedVideoUrl = playerUrl;
                                searchInput.value = 'Фильм выбран! Нажимайте «Открыть кинозал» 🎬';
                                searchInput.disabled = true;
                                resultsBox.innerHTML = '';
                                updateButtonState(true);
                            });
                            resultsBox.appendChild(btn);
                        });
                    }
                } catch (err) { console.error(err); }
                finally { loadingTxt.classList.add('hidden'); }
            }, 400);
        });

        // Парсер ссылок Ютуб/ВК/Рутуб на лету
        function parseDirectLink(url) {
            let iframeUrl = url.trim();
            let isValid = false;

            if (iframeUrl.includes('vk.com') || iframeUrl.includes('vkvideo.ru')) {
                const match = iframeUrl.match(/video(-?\d+_\d+)/);
                if (match && match[1]) {
                    const parts = match[1].split('_');
                    iframeUrl = 'https://vk.com' + parts[0] + '&id=' + parts[1] + '&hd=2&autoplay=1';
                    isValid = true;
                }
            } else if (iframeUrl.includes('rutube.ru/video')) {
                const match = iframeUrl.match(/video\/([a-zA-Z0-9]+)/);
                if (match && match[1]) {
                    iframeUrl = 'https://rutube.ru' + match[1] + '?autoplay=1';
                    isValid = true;
                }
            } else if (iframeUrl.includes('youtube.com') || iframeUrl.includes('youtu.be')) {
                const match = iframeUrl.match(/(?:v=|\/)([a-zA-Z0-9_-]{11})/);
                if (match && match[1]) {
                    iframeUrl = 'https://youtube.com' + match[1] + '?autoplay=1&enablejsapi=1';
                    isValid = true;
                }
            }

            if (isValid) {
                selectedVideoUrl = iframeUrl;
                updateButtonState(true);
            } else {
                selectedVideoUrl = '';
                updateButtonState(false);
            }
        }

        // Очистка инпута по крестику
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchInput.disabled = false;
            selectedVideoUrl = '';
            resultsBox.innerHTML = currentTab !== 'catalog' ? '<div class="p-4 text-center text-[10px] text-white/30 italic leading-normal">Откройте вкладку ' + currentTab.toUpperCase() + ', скопируйте ссылку на video и вставьте её выше.</div>' : '';
            clearBtn.classList.add('hidden');
            searchIcon.classList.remove('hidden');
            updateButtonState(false);
        });

        // Переключение состояния неоновой кнопки
        function updateButtonState(active) {
            if (active) {
                startBtn.disabled = false;
                startBtn.className = "w-full py-4 bg-gradient-to-r from-purple-600 to-indigo-600 font-black rounded-2xl text-xs uppercase tracking-wider mb-2 border border-purple-500/20 shadow-lg shadow-purple-600/20 active:scale-95 transition-all cursor-pointer text-white";
            } else {
                startBtn.disabled = true;
                startBtn.className = "w-full py-4 bg-white/5 text-white/20 border border-transparent font-black rounded-2xl text-xs uppercase tracking-wider mb-2 transition-all cursor-not-allowed";
            }
        }
    </script>
</body>
</html>
